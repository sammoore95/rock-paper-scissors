<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="javascript.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="game-header">Welcome to Rock, Paper, Scissors!</h1>
    <div class="game-description">
        <h3>Rules:</h3>
        <p>The goal of this game is to beat the computer in 5 rounds of 
            Rock, Paper, Scissors. In this game, rock beats scissors, paper beats
            rock, and scissors beats paper. Make your selection below to start the game.
        </p>
    </div>
    <div class="button-section">
        <h3 class="human-prompt"></h3>
        <div class="buttons">
            <button id="rock-button" value="rock">Rock</button>
            <button id="paper-button" value="paper">Paper</button>
            <button id="scissors-button" value="scissors">Scissors</button>
        </div>
    </div>
    <div class="result-window">
        <h3 class="round-result"></h3>
        <div class="human-choice-section">
            <h3 class="human-choice"></h3>
            <h3 class="computer-choice"></h3>
        </div>
        <div class="score-section">
            <h4 class="score"></h4>
        </div>
        <div class="game-result-section">
            <h4 class="game-result"></h4>
        </div>
    </div>

    
    
</body>
</html>
