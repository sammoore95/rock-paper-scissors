<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="javascript.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="game-header">Welcome to Rock, Paper, Scissors!</h1>
    <div class="game-description">
        <h3>Rules:</h3>
        <p>The goal of this game is to beat the computer in 5 rounds of 
            Rock, Paper, Scissors. In this game, rock beats scissors, paper beats
            rock, and scissors beats paper. Make your selection below to start the game.
        </p>
    </div>
    <div class="button-section">
        <h3>Choice:</h3>
        <div class="buttons">
            <button class="rock-button">Rock</button>
            <button class="paper-button">Paper</button>
            <button class="scissors-button">Scissors</button>
        </div>
    </div>
    <div class="result-window">
        <h3>Result:</h3>
        <div class="human-choice-section">
            <h3>Human choice:</h3>
            <p class="human-choice">blach</p>
        </div>
    </div>

    
    
</body>
</html>
